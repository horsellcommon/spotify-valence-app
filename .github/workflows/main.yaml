name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary: SVAT-windows
            artifact: SVAT-windows.exe
            encdec: encdec-windows.exe
          - os: ubuntu-latest
            platform: linux
            binary: SVAT-linux
            artifact: SVAT-linux
            encdec: encdec-linux
          - os: macos-latest
            platform: macos
            binary: SVAT-macos
            artifact: SVAT-macos
            encdec: encdec-macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build SVAT executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name "${{ matrix.binary }}" app.py

      - name: Build encryption utility
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "${{ matrix.encdec }}" encdec.py

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.encdec }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true